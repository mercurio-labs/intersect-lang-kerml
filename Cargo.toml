[workspace]
exclude = ["crates/intersect-kerml-python"]
members = ["crates/intersect-kerml-ide", "crates/intersect-kerml", "crates/intersect-kerml-eval", "crates/intersect-kerml-web", "crates/intersect-cli", "crates/intersect-kpar", "crates/intersect-kpar-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mercurio-labs/intersect-lang-kerml"
publish = false

[workspace.dependencies]
# Visualization contracts are not in the split Model or Text repositories yet
# (core PR #6 is unmerged). The crate depends only on serde, so it stays on
# the pre-split revision the facade was written against until it has a home.
intersect-views = { git = "https://github.com/mercurio-labs/intersect", rev = "17554be4fa73bdf0fecda5bee5d01ed3f49e8830" }
intersect-kerml = { path = "crates/intersect-kerml" }
intersect-kpar = { path = "crates/intersect-kpar" }
intersect-build-support = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "1955d1e9e99cad50049dd1f00096bee5fbe1a160" }
# Canonical independent upstreams. Model pins agree with Text's Model pin.
intersect-model = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "1955d1e9e99cad50049dd1f00096bee5fbe1a160" }
intersect-text = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "4548d0aba245575263eae12db028582387abe442" }
intersect-web = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "4548d0aba245575263eae12db028582387abe442", default-features = false }
intersect-project-host = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "1955d1e9e99cad50049dd1f00096bee5fbe1a160" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
quick-xml = "0.41.0"
sha2 = "0.10.9"
iri-string = { version = "0.7.12", default-features = false, features = ["alloc"] }

# Fast test builds: `cargo test --profile test-fast ...`. Workspace crates get
# light optimization (fast to compile, much faster to run than opt-level 0);
# dependencies are fully optimized once and then cached. No debug info.
[profile.test-fast]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true

[profile.test-fast.package."*"]
opt-level = 3
