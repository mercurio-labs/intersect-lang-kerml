[workspace]
exclude = ["crates/intersect-kerml-python"]
members = ["crates/intersect-kerml-ide", "crates/intersect-kerml", "crates/intersect-kerml-eval", "crates/intersect-kerml-web", "crates/intersect-cli", "crates/intersect-kpar", "crates/intersect-kpar-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mercurio-labs/intersect-lang-kerml"
publish = false

[workspace.dependencies]
intersect-load = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "69e2303c7f3ce57c189ea2d8856f54ade1cab0be" }
# Shared scene contracts and host adapters for the M14 SDK preview.
intersect-views = { git = "https://github.com/mercurio-labs/intersect-views.git", rev = "735737e110b65c9f176b29c6108b04075d1cdff1" }
intersect-view-host = { git = "https://github.com/mercurio-labs/intersect-views.git", rev = "735737e110b65c9f176b29c6108b04075d1cdff1" }
intersect-kerml = { path = "crates/intersect-kerml" }
intersect-kpar = { path = "crates/intersect-kpar" }
intersect-build-support = "=0.1.0-alpha.2"
# Exact registry versions keep runtime types shared with their host adapters.
intersect-model = "=0.1.0-alpha.2"
intersect-text = "=0.1.0-alpha.2"
intersect-web = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "69e2303c7f3ce57c189ea2d8856f54ade1cab0be", default-features = false }
intersect-project-host = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "11c33990a50cb4074d4f97619687a6b33358e560" }
intersect-run-catalog = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "d9c6677c1773a9b2ff9577ad2a74b326819c62eb" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
quick-xml = "0.41.0"
sha2 = "0.10.9"
iri-string = { version = "0.7.12", default-features = false, features = ["alloc"] }

# Fast test builds: `cargo test --profile test-fast ...`. Workspace crates get
# light optimization (fast to compile, much faster to run than opt-level 0);
# dependencies are fully optimized once and then cached. No debug info.
[profile.test-fast]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true

[profile.test-fast.package."*"]
opt-level = 3

# Development source overrides for unreleased shared editor APIs. See docs/editor-services.md.
[patch.crates-io]
intersect-model = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "11c33990a50cb4074d4f97619687a6b33358e560" }
intersect-build-support = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "11c33990a50cb4074d4f97619687a6b33358e560" }
intersect-text = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "69e2303c7f3ce57c189ea2d8856f54ade1cab0be" }
