[workspace]
exclude = ["crates/intersect-kerml-python"]
members = ["crates/intersect-kerml-ide", "crates/intersect-kerml", "crates/intersect-kerml-eval", "crates/intersect-kerml-web", "crates/intersect-cli", "crates/intersect-kpar", "crates/intersect-kpar-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mercurio-labs/intersect-lang-kerml"
publish = false

[workspace.dependencies]
intersect-load = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "22ade314be84b2fa9644e1e3ea3edfbce1932713" }
# Generic visualization contracts and host adapters live in public Model.
intersect-views = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "b3b1b5e825e969bcb5e0219416ec2f053aa84206" }
intersect-kerml = { path = "crates/intersect-kerml" }
intersect-kpar = { path = "crates/intersect-kpar" }
intersect-build-support = "=0.1.0-alpha.1"
# Exact registry versions keep runtime types shared with their host adapters.
intersect-model = "=0.1.0-alpha.1"
intersect-text = "=0.1.0-alpha.1"
intersect-web = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "22ade314be84b2fa9644e1e3ea3edfbce1932713", default-features = false }
intersect-project-host = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "b3b1b5e825e969bcb5e0219416ec2f053aa84206" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
quick-xml = "0.41.0"
sha2 = "0.10.9"
iri-string = { version = "0.7.12", default-features = false, features = ["alloc"] }

# Fast test builds: `cargo test --profile test-fast ...`. Workspace crates get
# light optimization (fast to compile, much faster to run than opt-level 0);
# dependencies are fully optimized once and then cached. No debug info.
[profile.test-fast]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true

[profile.test-fast.package."*"]
opt-level = 3

# Development source overrides for unreleased shared editor APIs. See docs/editor-services.md.
[patch.crates-io]
intersect-model = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "b3b1b5e825e969bcb5e0219416ec2f053aa84206" }
intersect-build-support = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "b3b1b5e825e969bcb5e0219416ec2f053aa84206" }
intersect-text = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "22ade314be84b2fa9644e1e3ea3edfbce1932713" }
