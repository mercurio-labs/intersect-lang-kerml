[package]
name = "intersect-kerml-python"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
intersect-kerml = { path = "../intersect-kerml" }
pyo3 = { version = "=0.27.2", features = ["extension-module", "abi3-py311"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
debug = 0

# Development source overrides for unreleased shared editor APIs. See docs/editor-services.md.
[patch.crates-io]
intersect-model = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "5911b8ebea2fa60290fcf6859c8b11dcada70513" }
intersect-build-support = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "5911b8ebea2fa60290fcf6859c8b11dcada70513" }
intersect-text = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "2e6b861d153c45c3fdb660684956ce21b73b59d0" }
