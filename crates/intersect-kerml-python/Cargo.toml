[package]
name = "intersect-kerml-python"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
intersect-kerml = { path = "../intersect-kerml" }
pyo3 = { version = "=0.27.2", features = ["extension-module", "abi3-py311"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
debug = 0
