[package]
name = "intersect-kerml-python"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
intersect-kerml = { path = "../intersect-kerml" }
pyo3 = { version = "=0.27.2", features = ["extension-module", "abi3-py311"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
debug = 0

# Development source overrides for unreleased shared editor APIs. See docs/editor-services.md.
[patch.crates-io]
intersect-model = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "ee43b0696a99f966d90bf1b737aaf98e9ac9ba07" }
intersect-build-support = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "ee43b0696a99f966d90bf1b737aaf98e9ac9ba07" }
intersect-text = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "7ce03b8bf9e0db29ca32a62d7c7a9c7bd454328e" }
