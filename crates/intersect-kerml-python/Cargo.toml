[package]
name = "intersect-kerml-python"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
intersect-kerml = { path = "../intersect-kerml" }
pyo3 = { version = "=0.27.2", features = ["extension-module", "abi3-py311"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
debug = 0

# Development source overrides for unreleased shared editor APIs. See docs/editor-services.md.
[patch.crates-io]
intersect-model = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "a7c8a8a5ec25c0cc12dbbde8d2dce10083c83cff" }
intersect-build-support = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "a7c8a8a5ec25c0cc12dbbde8d2dce10083c83cff" }
intersect-text = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "7ac26b23108d8df91c1b1792d5433360173d17c6" }
