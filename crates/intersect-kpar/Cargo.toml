[package]
name = "intersect-kpar"
description = "KerML project interchange archives (.kpar): bounded reading, deterministic writing and offline dependency resolution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Bytes in, bytes out: no filesystem, network or clock, so the crate builds
# for wasm32-unknown-unknown and the CLI and browser hosts share it. It does
# not depend on Intersect core or on intersect-kerml.
[dependencies]
serde_json.workspace = true
sha2.workspace = true
iri-string.workspace = true
# Raw DEFLATE for ZIP entries (pure Rust).
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
crc32fast = { version = "1.5.0", default-features = false }
# `version` and `versionConstraint` matching (Semantic Versioning 2.0).
semver = { version = "1.0.28", default-features = false }

[features]
milestone-tests = []
