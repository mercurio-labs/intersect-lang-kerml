name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  RUSTUP_TOOLCHAIN: '1.99.1'
  INTERSECT_TEST_REPORTS: ${{ github.workspace }}/target/test-reports

jobs:
  verify:
    name: Native and WASM (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Short Windows Cargo cache paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CARGO_HOME=C:\c" >> $env:GITHUB_ENV
          git config --global core.longpaths true
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Formatting
        run: python -B tools/format_workspace.py --check
      - name: Lint
        run: python -B tools/compiler_build.py -- clippy --workspace --all-targets --locked -- -D warnings
      - name: Quick tier
        run: python -B tools/compiler_build.py --report -- test --profile test-fast -p intersect-kerml-ide -p intersect-kerml -p intersect-kerml-eval -p intersect-kerml-web -p intersect-cli -p intersect-kpar -p intersect-kpar-host --lib --bins --tests --locked
      - name: WASM build
        run: python -B tools/compiler_build.py -- build --workspace --lib --target wasm32-unknown-unknown --locked

  components:
    name: Component runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Short Windows Cargo cache paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CARGO_HOME=C:\c" >> $env:GITHUB_ENV
          git config --global core.longpaths true
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --target wasm32-unknown-unknown
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Component-enabled quick controls
        run: python -B tools/compiler_build.py --report -- test --profile test-fast -p intersect-kerml-ide -p intersect-kerml -p intersect-kpar-host --features intersect-kerml-ide/components,intersect-kerml/components,intersect-kpar-host/components --lib --tests --locked
      - name: Component-enabled strict lint
        run: python -B tools/compiler_build.py -- clippy -p intersect-kerml-ide -p intersect-kerml -p intersect-kpar-host --features intersect-kerml-ide/components,intersect-kerml/components,intersect-kpar-host/components --all-targets --locked -- -D warnings
      - name: Component-enabled WASM libraries
        run: python -B tools/compiler_build.py -- build -p intersect-kerml-ide -p intersect-kerml -p intersect-kpar-host --features intersect-kerml-ide/components,intersect-kerml/components,intersect-kpar-host/components --lib --target wasm32-unknown-unknown --locked
