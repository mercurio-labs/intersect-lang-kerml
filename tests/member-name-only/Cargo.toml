[package]
name = "member-name-only-consumer"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
intersect-model = "=0.1.0-alpha.1"
intersect-kerml = { path = "../../crates/intersect-kerml" }
serde_json = "1"

# Development source overrides for unreleased shared editor APIs. See docs/editor-services.md.
[patch.crates-io]
intersect-model = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "b3b1b5e825e969bcb5e0219416ec2f053aa84206" }
intersect-build-support = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "b3b1b5e825e969bcb5e0219416ec2f053aa84206" }
intersect-text = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "22ade314be84b2fa9644e1e3ea3edfbce1932713" }
